<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="description" content="A kitten window for Chrisi: a joke, a photograph, a short film, and a purr.">
  <title>Kitten Window</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%23f4effa' width='32' height='32' rx='8'/%3E%3Ccircle cx='16' cy='19' r='8' fill='%236e4f96'/%3E%3Cpath d='M9 14 L12 6 L15 14 Z' fill='%236e4f96'/%3E%3Cpath d='M23 14 L20 6 L17 14 Z' fill='%236e4f96'/%3E%3Ccircle cx='13' cy='18' r='1.1' fill='%23f7f3fb'/%3E%3Ccircle cx='19' cy='18' r='1.1' fill='%23f7f3fb'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,520;9..144,650&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header class="hero">
      <div>
        <p class="eyebrow">For Chrisi</p>
        <h1>Kitten Window</h1>
        <p class="lede">A quiet spot you can open whenever you want one small good thing.</p>
      </div>
      <figure class="home-cats">
        <img src="images/our-cats.jpg" alt="Two fluffy cats on a wood floor by a glass door, one gray and one cream.">
        <figcaption>The two of them, keeping the window.</figcaption>
      </figure>
    </header>

    <div class="keys" role="group" aria-label="Pick one">
      <button type="button" id="joke" class="key key-joke">
        <span class="key-kicker">Listen</span>
        <span class="key-label">Hear a joke</span>
        <span class="key-hint">Press 1</span>
      </button>
      <button type="button" id="photo" class="key key-photo">
        <span class="key-kicker">Look</span>
        <span class="key-label">See a kitten</span>
        <span class="key-hint">Press 2</span>
      </button>
      <button type="button" id="video" class="key key-video">
        <span class="key-kicker">Watch</span>
        <span class="key-label">Play a clip</span>
        <span class="key-hint">Press 3</span>
      </button>
      <button type="button" id="purr" class="key key-purr" aria-pressed="false">
        <span class="key-kicker">Stay</span>
        <span class="key-label">Have a purr</span>
        <span class="key-hint">Press 4</span>
      </button>
    </div>

    <section id="stage" class="stage" aria-live="polite">
      <div class="empty">
        <p class="empty-title">The sunbeam is free.</p>
        <p>Press something whenever you want.</p>
      </div>
    </section>

    <footer>
      <p>Made for Chrisi. The photograph up top is from home. The others are from Unsplash. Films play from YouTube.</p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
